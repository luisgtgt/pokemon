<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="script.js"></script>
    <link href="https://fonts.cdnfonts.com/css/ketchum" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
    <title>Pokemon</title>
</head>

<body>
    <video src="./media/pokemon-diamond-and-pearl.1920x1080.mp4" id="fondo-total" autoplay muted loop playsinline>
    </video>
    <div class="columna1">
        <img src="./media/pokedex.png" alt="fondo" id="fondo">
        <div id="numero"></div>
        <h4>Tipos</h4>
        <div id="tipos"></div>
        <h4>Debilidades</h4>
        <div id="debilidades"></div>
    </div>
    <div class="imagen">

        <h1 id="nombre">Pokemon</h1>
        <div class="buscar">
            <img src="./media/barra.png" alt="barra de busqueda">
            <input type="text" placeholder="escribe el numero o nombre de tu pokemon" id="pokemon">
            <button onclick="buscar()"></button>
        </div>
        <div id="pokeball">
            <div>
                <img src="" alt="" id="imagen">
            </div>
        </div>

    </div>
    <div class="datos">
        <h1>Estadisticas</h1>
        <div>
            <h3>HP</h3>
            <div class="barra">
                <div id="color-hp"></div>
            </div>
        </div>
        <div>
            <h3>ATTACK</h3>
            <div class="barra">
                <div id="color-attack"></div>
            </div>
        </div>
        <div>
            <h3>DEFENSE</h3>
            <div class="barra">
                <div id="color-defense"></div>
            </div>
        </div>
        <div>
            <h3>SP ATTAC</h3>
            <div class="barra">
                <div id="color-spattack"></div>
            </div>
        </div>
        <div>
            <h3>SP DEFENSE</h3>
            <div class="barra">
                <div id="color-spdefense"></div>
            </div>
        </div>
        <div>
            <h3>SPEED</h3>
            <div class="barra">
                <div id="color-speed"></div>
            </div>
        </div>
    </div>
</body>

</html>
